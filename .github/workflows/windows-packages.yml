name: Windows packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install packaging tools
        run: |
          python -m pip install PyYAML==6.0.2
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Fetch verified Windows dependencies
        run: python scripts/windows-packaging.py prepare
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          . ./scripts/goblin-env.ps1 -GtkDir "$PWD/build/windows/tools/gtk" -CrystalDir "$PWD/build/windows/tools/crystal"
          python -m unittest discover -s tests -p test_windows_packaging.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows generator regression tests failed' }
          python scripts/windows-packaging.py build
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Test installed application and bundled converters
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64-setup
          path: dist/*-windows-x86_64-setup.exe*
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: [installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x86_64-setup
          path: dist
      - name: Attach Windows setup to the published GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
