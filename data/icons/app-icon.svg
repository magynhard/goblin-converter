<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Goblin Converter</title>
  <desc>A folded ivory document with a friendly green goblin and a bold red conversion arrow, in the GNOME app icon style.</desc>
  <defs>
    <linearGradient id="paper-edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9a9996"/>
      <stop offset=".12" stop-color="#deddda"/>
      <stop offset=".88" stop-color="#deddda"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="goblin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8ff0a4"/>
      <stop offset=".45" stop-color="#57e389"/>
      <stop offset="1" stop-color="#33d17a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f66151"/>
      <stop offset="1" stop-color="#e01b24"/>
    </linearGradient>
  </defs>

  <!-- A four-pixel front profile gives the paper the same depth as Disk View. -->
  <path d="M36 16h42l22 22v66a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8V24a8 8 0 0 1 8-8Z" fill="#77767b"/>
  <path d="M36 12h42l22 22v66a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8Z" fill="url(#paper-edge)"/>
  <path d="M36 12h42l22 22v64a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8Z" fill="#f6f5f4"/>
  <path d="M78 14v18a6 6 0 0 0 6 6h16v-4Z" fill="#000000" opacity=".08"/>
  <path d="M78 12v16a6 6 0 0 0 6 6h16Z" fill="url(#fold)"/>

  <!-- Broad ears keep the goblin silhouette legible at launcher sizes. -->
  <g transform="translate(0 -12)">
  <path d="M46 48C36 42 25 40 16 42c2 14 12 28 28 30Zm36 0c10-6 21-8 30-6-2 14-12 28-28 30Z" fill="#26a269"/>
  <path d="M46 45C36 39 25 37 16 39c2 14 12 28 28 30Zm36 0c10-6 21-8 30-6-2 14-12 28-28 30Z" fill="#57e389"/>
  <path d="M40 50c-5-3-10-5-16-5 4 7 9 12 16 15Zm48 0c5-3 10-5 16-5-4 7-9 12-16 15Z" fill="#26a269"/>
  <rect x="38" y="33" width="52" height="50" rx="25" fill="#26a269"/>
  <rect x="38" y="30" width="52" height="50" rx="25" fill="url(#goblin)"/>
  <path d="M45 43c4-6 11-10 19-10s15 4 19 10" fill="none" stroke="#b4f5c2" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="53" cy="53" rx="4" ry="5" fill="#1e4b3a"/>
  <ellipse cx="75" cy="53" rx="4" ry="5" fill="#1e4b3a"/>
  <circle cx="52" cy="51" r="1.25" fill="#ffffff"/>
  <circle cx="74" cy="51" r="1.25" fill="#ffffff"/>
  <path d="M54 65c5 6 15 6 20 0" fill="none" stroke="#1e4b3a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- One bold arrow communicates conversion without lettering or tiny details. -->
  <path d="M40 83h34v-8l18 16-18 16v-8H40a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4Z" fill="#a51d2d"/>
  <path d="M40 80h34v-8l18 16-18 16v-8H40a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4Z" fill="url(#arrow)"/>
</svg>
